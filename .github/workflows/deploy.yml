# Shared deploy workflow for pages.lifesci.ucla.edu
# Lives in uclalifesciences/pages-workflows and is called by every site repository.
#
# A lab repository needs only this caller, identical in every repo:
#
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
#   jobs:
#     publish:
#       uses: uclalifesciences/pages-workflows/.github/workflows/deploy.yml@v1
#
# Where and how the site is published (path, generator, custom domain, deploy
# key) comes from the hosting side: the on-prem runner looks the repository up
# in its site registry (/etc/pages/sites.json, managed by Ansible). The
# repository therefore needs no inputs and no secrets, and a site is published
# only if LSC has registered it.
#
# Older callers that pass `site`/`generator` inputs and a DEPLOY_KEY secret keep
# working unchanged.
#
# Setup (works on the GitHub Free plan):
#   - this repo is public (it holds no secrets) so private site repos can call it
#   - site repos are private; the runner group excludes public repositories and
#     is restricted to this workflow
#   - the web nodes to deploy to come from the runner (PAGES_HOSTS in its .env)
name: pages-deploy

on:
  workflow_call:
    inputs:
      site:
        description: "Optional override: directory under /var/www/pages, e.g. eeb/alfaro (default: from the runner's registry)"
        required: false
        type: string
        default: ""
      generator:
        description: "Optional override: astro | hugo | html (default: from the runner's registry)"
        required: false
        type: string
        default: ""
      custom_domain:
        description: "Optional override: canonical custom domain"
        required: false
        type: string
        default: ""
      output_dir:
        description: "Publish this directory instead of the generator default"
        required: false
        type: string
        default: ""
    secrets:
      DEPLOY_KEY:
        description: "Optional: per-site deploy key (default: the key held by the runner)"
        required: false

permissions:
  contents: read

jobs:
  deploy:
    # Only ever runs for pushes (CMS saves included) or manual/console-triggered
    # runs on main - never for pull requests, so code from forks cannot reach the
    # self-hosted runner.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, lsc-pages]
    timeout-minutes: 20
    concurrency:
      group: pages-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install deploy key passed by the caller (older callers only)
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -n "$DEPLOY_KEY" ]; then
            umask 077
            printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key"
          fi

      - name: Build and deploy
        env:
          REPO: ${{ github.repository }}
          SITE: ${{ inputs.site }}
          GENERATOR: ${{ inputs.generator }}
          CUSTOM_DOMAIN: ${{ inputs.custom_domain }}
          OUTPUT_DIR: ${{ inputs.output_dir }}
          PAGES_HOSTS_ORG: ${{ vars.PAGES_HOSTS }}
        run: |
          HOSTS="${PAGES_HOSTS_ORG:-${PAGES_HOSTS:-}}"
          [ -n "$HOSTS" ] || { echo "No web nodes: set PAGES_HOSTS on the runner (Ansible pages_deploy_hosts)"; exit 1; }
          if [ -n "$SITE" ]; then
            args=(-s "$SITE" -g "$GENERATOR")
          else
            args=(-R "$REPO")
          fi
          [ -s "$RUNNER_TEMP/deploy_key" ] && args+=(-k "$RUNNER_TEMP/deploy_key")
          [ -n "$CUSTOM_DOMAIN" ] && args+=(-d "$CUSTOM_DOMAIN")
          [ -n "$OUTPUT_DIR" ] && args+=(-o "$OUTPUT_DIR")
          /usr/local/bin/pages-build-deploy "${args[@]}" -H "$HOSTS" "$GITHUB_WORKSPACE"

      - name: Remove deploy key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key"
